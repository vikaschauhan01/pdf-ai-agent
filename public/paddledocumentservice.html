<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paddle OCR Dashboard</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        .card{
            border:1px solid #ddd;
            border-radius:10px;
            padding:20px;
            margin-top:20px;
        }

        textarea{
            width:100%;
            height:400px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <h1>Paddle OCR Dashboard</h1>

    <input type="file" id="pdfFile">

    <button onclick="runPaddleOCR()">
        Extract Text
    </button>

    <div class="card">

        <h2>Paddle OCR Result</h2>

        <p>
            <b>Processing Time:</b>
            <span id="processingTime">-</span>
        </p>

        <p>
            <b>Characters Extracted:</b>
            <span id="characters">-</span>
        </p>

        <textarea id="ocrText"></textarea>

    </div>

<script>

async function runPaddleOCR(){

    const file =
        document.getElementById("pdfFile")
        .files[0];

    if(!file){
        alert("Select PDF");
        return;
    }

    const formData = new FormData();

    formData.append(
        "document",
        file
    );

    const response = await fetch(
        "/paddle-ocr/upload",
        {
            method:"POST",
            body:formData
        }
    );

    const result =
        await response.json();

    document.getElementById(
        "processingTime"
    ).innerText =
        result.processingTime || "-";

    document.getElementById(
        "characters"
    ).innerText =
        result.text
            ? result.text.length
            : 0;

    document.getElementById(
        "ocrText"
    ).value =
        result.text || "";
}

</script>

</body>
</html>
