<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Interview Dossier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EEF0EA;
    --paper-raised: #F7F8F4;
    --ink: #1C2321;
    --ink-soft: #4B5450;
    --rule: #CBCFC2;
    --rule-strong: #9EA495;
    --accent: #3F6C51;      /* recording green — active / go */
    --accent-soft: #DCE6DC;
    --grade: #A6772C;       /* margin-note ochre — evaluation */
    --grade-soft: #F1E6D3;
    --danger: #9B3B32;
    --radius: 3px;
    --shadow: 0 1px 2px rgba(28,35,33,0.06), 0 6px 20px rgba(28,35,33,0.05);
  }

  *{ box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin:0;
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(63,108,81,0.06), transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 56px 20px 100px;
  }

  .wrap{ max-width: 680px; margin: 0 auto; }

  /* ---------- Masthead ---------- */
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 36px;
  }
  .masthead h1{
    font-family:'Newsreader', serif;
    font-weight: 500;
    font-size: 30px;
    letter-spacing: -0.01em;
    margin: 0;
  }
  .masthead .case-id{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: right;
  }
  .case-id .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--rule-strong); margin-right:6px; vertical-align:1px;
  }
  .case-id.live .dot{
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(63,108,81,0.5);
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow: 0 0 0 0 rgba(63,108,81,0.45); }
    70%{ box-shadow: 0 0 0 7px rgba(63,108,81,0); }
    100%{ box-shadow: 0 0 0 0 rgba(63,108,81,0); }
  }

  /* ---------- Card / Panel ---------- */
  .panel{
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 30px;
    margin-bottom: 24px;
  }
  .panel-label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 18px;
    display:flex; align-items:center; gap:10px;
  }
  .panel-label::after{
    content:''; flex:1; height:1px; background: var(--rule);
  }

  /* ---------- Form fields ---------- */
  .field{ margin-bottom: 18px; }
  .field label{
    display:block;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  input[type="text"], textarea{
    width: 100%;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    border-radius: var(--radius);
    padding: 11px 12px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input[type="text"]:focus, textarea:focus{
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea{ min-height: 130px; resize: vertical; line-height: 1.55; }

  .file-row{
    display:flex; align-items:center; gap:12px;
    border: 1px dashed var(--rule-strong);
    border-radius: var(--radius);
    padding: 12px 14px;
    background: var(--paper);
    cursor:pointer;
  }
  .file-row:hover{ border-color: var(--accent); }
  .file-row svg{ flex-shrink:0; color: var(--ink-soft); }
  .file-row .file-text{ font-size: 14px; color: var(--ink-soft); }
  .file-row input[type="file"]{ display:none; }
  .file-row.has-file .file-text{ color: var(--ink); font-weight:500; }

  /* ---------- Buttons ---------- */
  button{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    letter-spacing: 0.01em;
    padding: 12px 20px;
    border-radius: var(--radius);
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--paper-raised);
    cursor: pointer;
    transition: transform .08s ease, background .15s ease, opacity .15s ease;
    width: auto;
    display:inline-flex; align-items:center; gap:8px;
  }
  button:hover{ background:#2c352f; }
  button:active{ transform: translateY(1px); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.block{ width:100%; justify-content:center; margin-top:4px; }
  button svg{ width:15px; height:15px; }

  /* ---------- Transcript ---------- */
  .entry{ margin-bottom: 22px; }
  .entry:last-child{ margin-bottom: 0; }
  .entry-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:8px;
  }
  .entry-num{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; color: var(--ink-soft);
  }
  .entry-speaker{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    font-weight:500;
  }
  .entry-speaker.interviewer{ color: var(--accent); }
  .entry-speaker.candidate{ color: var(--ink-soft); }
  .entry-body{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.5;
    color: var(--ink);
    padding-left: 2px;
  }
  .rule{ border:none; border-top:1px solid var(--rule); margin: 20px 0; }

  /* ---------- Evaluation / margin note ---------- */
  .eval-panel{ position: relative; }
  .eval-top{
    display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;
  }
  .eval-q{
    font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing:.08em;
  }
  .score-badge{
    font-family:'Newsreader', serif;
    font-weight: 600;
    font-size: 26px;
    color: var(--grade);
    background: var(--grade-soft);
    border: 1px solid var(--grade);
    border-radius: 999px;
    padding: 2px 16px 4px;
    line-height: 1.3;
  }
  .score-badge span{ font-size:14px; font-weight:500; opacity:.75; }
  .note{
    border-left: 3px solid var(--grade);
    padding: 4px 0 4px 16px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--ink);
    position: relative;
  }
  .note::before{
    content:'—';
    position:absolute; left:-3px; top:4px;
    color: var(--grade);
  }

  .empty-hint{
    font-size: 13px; color: var(--ink-soft); margin-top: 10px;
  }

  .hidden{ display:none !important; }

  footer.hint{
    text-align:center; font-size:12px; color: var(--ink-soft);
    font-family:'IBM Plex Mono', monospace; margin-top: 40px; letter-spacing: .03em;
  }

  @media (max-width: 520px){
    body{ padding: 32px 14px 80px; }
    .masthead{ flex-direction:column; align-items:flex-start; gap:8px; }
    .masthead .case-id{ text-align:left; }
    .panel{ padding: 22px 18px; }
    .entry-body{ font-size:17px; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="masthead">
      <h1>Interview&nbsp;Dossier</h1>
      <div class="case-id" id="caseId">No.&nbsp;pending</div>
    </div>

    <!-- INTAKE -->
    <div class="panel" id="intakePanel">
      <p class="panel-label">Case intake</p>

      <div class="field">
        <label for="candidateName">Candidate name</label>
        <input type="text" id="candidateName" placeholder="Enter your name" />
      </div>

      <div class="field">
        <label for="position">Position under review</label>
        <input type="text" id="position" placeholder="e.g. React Developer" />
      </div>

      <div class="field">
        <label for="resume">Resume</label>
        <label class="file-row" id="fileRow" for="resume">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="file-text" id="fileText">Attach PDF resume — click to browse</span>
          <input type="file" id="resume" accept=".pdf" />
        </label>
      </div>

      <button class="block" id="startBtn" onclick="startInterview()">
        Begin interview
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <!-- TRANSCRIPT -->
    <div class="panel hidden" id="transcriptPanel">
      <p class="panel-label">Transcript</p>

      <div class="entry">
        <div class="entry-head">
          <span class="entry-num" id="qNum">01</span>
          <span class="entry-speaker interviewer">Interviewer</span>
        </div>
        <p class="entry-body" id="questionText"></p>
      </div>

      <hr class="rule" />

      <div class="entry">
        <div class="entry-head">
          <span class="entry-num" id="aNum">01</span>
          <span class="entry-speaker candidate">You</span>
        </div>
        <textarea id="answer" placeholder="Write your response…"></textarea>
      </div>

      <button class="block" id="submitBtn" onclick="submitAnswer()">
        Submit answer
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="empty-hint">Answers are recorded to the dossier and reviewed after each question.</p>
    </div>

    <!-- EVALUATION -->
    <div class="panel eval-panel hidden" id="resultPanel">
      <div class="eval-top">
        <p class="panel-label" style="margin:0; flex:none;">Evaluation</p>
        <span class="eval-q" id="evalQ"></span>
      </div>
      <div class="score-badge" id="scoreBadge">–<span>/10</span></div>
      <p class="note" id="feedback" style="margin-top:16px;"></p>
    </div>

    <footer class="hint" id="footerHint">Interview not yet started</footer>
  </div>

<script>
  let interviewId = null;
  let currentQuestion = 1;

  const fileInput = document.getElementById('resume');
  const fileRow = document.getElementById('fileRow');
  const fileText = document.getElementById('fileText');
  const caseId = document.getElementById('caseId');
  const footerHint = document.getElementById('footerHint');
  const startBtn = document.getElementById('startBtn');
  const submitBtn = document.getElementById('submitBtn');

  fileInput.addEventListener('change', () => {
    const f = fileInput.files[0];
    if (f) {
      fileText.textContent = f.name;
      fileRow.classList.add('has-file');
    }
  });

  function setBusy(btn, busy, label) {
    btn.disabled = busy;
    btn.querySelector('svg') && (btn.querySelector('svg').style.opacity = busy ? 0 : 1);
    if (busy) { btn.dataset.original = btn.firstChild.textContent; btn.firstChild.textContent = label; }
    else if (btn.dataset.original) { btn.firstChild.textContent = btn.dataset.original; }
  }

  async function startInterview() {
    const file = fileInput.files[0];
    const candidateName = document.getElementById('candidateName').value.trim();
    const position = document.getElementById('position').value.trim();

    if (!file) { alert('Please attach a resume to open the case.'); return; }
    if (!candidateName) { alert('Please enter the candidate name.'); return; }

    const formData = new FormData();
    formData.append('resume', file);
    formData.append('candidate_name', candidateName);
    formData.append('position', position);

    setBusy(startBtn, true, 'Opening case…');
    try {
      const response = await fetch('/api/interview/start', { method: 'POST', body: formData });
      const data = await response.json();

      interviewId = data.interviewId;
      caseId.innerHTML = '<span class="dot"></span>No. ' + (interviewId || '—');
      caseId.classList.add('live');
      footerHint.textContent = candidateName + ' · ' + (position || 'Position unspecified');

      document.getElementById('questionText').textContent = data.question;
      document.getElementById('qNum').textContent = String(currentQuestion).padStart(2, '0');
      document.getElementById('aNum').textContent = String(currentQuestion).padStart(2, '0');

      document.getElementById('transcriptPanel').classList.remove('hidden');
      document.getElementById('transcriptPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (e) {
      alert('Could not start the interview. Please try again.');
    } finally {
      setBusy(startBtn, false);
    }
  }

  async function submitAnswer() {
    const answer = document.getElementById('answer').value;
    if (!answer.trim()) { alert('Please write an answer before submitting.'); return; }

    setBusy(submitBtn, true, 'Reviewing…');
    try {
      const response = await fetch('/api/interview/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ interviewId, questionNo: currentQuestion, answer }),
      });
      const data = await response.json();

      document.getElementById('evalQ').textContent = 'Question ' + String(currentQuestion).padStart(2, '0');
      document.getElementById('scoreBadge').innerHTML = data.score + '<span>/10</span>';
      document.getElementById('feedback').textContent = data.feedback;
      document.getElementById('resultPanel').classList.remove('hidden');
      document.getElementById('resultPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });

      if (data.nextQuestion) {
        currentQuestion++;
        document.getElementById('questionText').textContent = data.nextQuestion;
        document.getElementById('qNum').textContent = String(currentQuestion).padStart(2, '0');
        document.getElementById('aNum').textContent = String(currentQuestion).padStart(2, '0');
        document.getElementById('answer').value = '';
      } else {
        caseId.classList.remove('live');
        footerHint.textContent = 'Interview complete — case closed';
        document.getElementById('transcriptPanel').classList.add('hidden');
      }
    } catch (e) {
      alert('Could not submit the answer. Please try again.');
    } finally {
      setBusy(submitBtn, false);
    }
  }
</script>

</body>
</html>
